[package]
name = "samp-tracer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Behavioural tracer DLL: logs which gta_sa.exe 1.0 US functions a SA:MP client calls (JSONL) and serves the control channel"

[lib]
name = "samp_tracer"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# EFX-1 (effect tracer, src/efx.rs): a complete 32-bit decoder with operand/memory info, so every
# memory operand of a single-stepped instruction can be computed. Decoder + instr_info only.
[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
